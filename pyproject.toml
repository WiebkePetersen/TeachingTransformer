[project]
name = "teachingtransformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "datasets==5.0.1",
    "evaluate==0.4.6",
    "huggingface-hub==1.28.0",
    "ipykernel>=7.3.0",
    "ipython==8.12.3",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "protobuf==7.36.0",
    "scikit-learn==1.9.0",
    "seqeval==1.2.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.1",
]

[project.scripts]
teachingtransformer = "teachingtransformer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
